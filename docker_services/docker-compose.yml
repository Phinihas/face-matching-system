services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: facematch_qdrant
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    environment:
      - TZ=Asia/Kolkata
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

configs:
  qdrant_config:
    content: |
      log_level: INFO