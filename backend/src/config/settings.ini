[app]
root_path = /face_matching
allow_origins = *
temp_dir = temp_uploads
pretrained_dir = pretrained
log_dir = logs
search_results_dir = temp_uploads/search_results
upload_dir = uploads
search_id_ttl_seconds = 3600

[database]
host = 127.0.0.1
port = 3306
database = ai_db4
charset = utf8mb4

[model]
face_size_width = 112
face_size_height = 112
match_threshold = 0.21
padding_ratio = 0.3
max_rotation_depth = 2
model_file_id = 1eUaSHG4pGlIZK7hBkqjyp2fc2epKoBvI
model_path = pretrained/adaface_ir50_ms1mv2.ckpt
collection_name = my_collection

[detector]
model_path = face_detection_yunet_2023mar.onnx
model_url = https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
det_size_width = 640
det_size_height = 640
score_threshold = 0.6
nms_threshold = 0.3
top_k = 5000

[ingestion]
batch_size = 20
update_interval = 10
