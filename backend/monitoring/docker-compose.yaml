version: "3.8"

services:
  prometheus-app:
    image: prom/prometheus:latest
    container_name: facematch-prometheus-observer
    restart: unless-stopped
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/data:/prometheus  # ✅ Persistent storage for metrics
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: facematch-grafana-observer
    restart: unless-stopped
    depends_on:
      - prometheus-app
      - loki-app
    ports:
      - 3000:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/data:/var/lib/grafana  # ✅ Persist Grafana dashboards & users
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - monitoring

  loki-app:
    image: grafana/loki:latest
    container_name: facematch-loki-observer
    restart: unless-stopped
    ports:
      - 3100:3100
    volumes:
      - ./loki/config.yml:/etc/loki/config.yaml
      - ./loki/data:/loki  # ✅ Persistent storage for logs
    networks:
      - monitoring

  promtail-app:
    image: grafana/promtail:latest
    container_name: facematch-promtail-observer
    restart: unless-stopped
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["-config.file=/etc/promtail/config.yaml"]
    depends_on:
      - loki-app
    networks:
      - monitoring

  # --- OPTIONAL: Example FastAPI app you can enable later ---
  # the-app:
  #   build: .
  #   container_name: the-app
  #   restart: unless-stopped
  #   ports:
  #     - "5060:5060"
  #   networks:
  #     - monitoring
  #   # volumes:
  #   #   - ./main.py:/app/main.py

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: facematch-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collection-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"  # OTLP gRPC receiver
      - "4318:4318"  # OTLP HTTP receiver
    networks:
      - monitoring
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:latest
    container_name: facematch-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
      - ./tempo/data:/tmp/tempo  # ✅ Persist traces
    ports:
      - "3200:3200"   # Tempo UI
      - "4317"        # OTLP gRPC (used by otel-collector)
    networks:
      - monitoring

networks:
  monitoring:
    # external: true  # Use external network created earlier
    driver: bridge
