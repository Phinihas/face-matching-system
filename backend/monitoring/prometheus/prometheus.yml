global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'prometheus-observer'
    static_configs:
      - targets: ['host.docker.internal:9090']
  - job_name: 'fastapi'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:8090'] 
        labels:
          app_name: 'posibot'
  - job_name: 'loki-observer'
    scrape_interval: 5s
    static_configs:
      - targets: ['loki:3100']
  - job_name: 'tempo'
    scrape_interval: 15s
    static_configs:
      - targets: ['tempo:3200']